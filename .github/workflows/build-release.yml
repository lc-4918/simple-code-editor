name: Build & Release

# Actions pinned to the last major running on Node.js 24: Node.js 20 is
# deprecated and the runners already forced Node 24 with a warning. These
# majors need a runner >= 2.327.1, which ubuntu-latest is well past. The
# breaking changes they announce do not concern this workflow: the block on
# fork pull requests (checkout v7) assumes pull_request_target or
# workflow_run, and the direct upload (upload-artifact v7) is optional, on an
# "archive" setting that is not set here.

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'

jobs:
  debug:
    name: Build debug APK
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Java 21: the Gradle daemon of this project asks for it, in
      # gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: simple-code-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Build & publish signed release APK
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The version comes from git describe, which needs the history and the
      # tags: without either, every release would be built as v0.0.0.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # The file is named after the tag by androidComponents in
      # build.gradle.kts, which reads it through git describe. Checking the
      # name turns two silent failures into loud ones: a release published with
      # no asset, and one built with the fallback version, whose version code
      # would be 1 and would never update anything.
      - name: Check the APK carries the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "describe: $(git describe --tags --always)"
          # A build that leaves tracked files changed is worth seeing, since
          # the version is read from the same repository it would be dirtying.
          git status --porcelain
          ls -l app/build/outputs/apk/release/
          test -f "app/build/outputs/apk/release/simple-code-${TAG}.apk"

      # What the application reads to learn that a newer one exists. Published
      # as an asset of the release rather than committed, so GitHub serves it
      # from its own network under a stable address, with no quota; the API
      # would allow sixty requests an hour and an address that moves.
      - name: Write the manifest the application checks
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          # The same arithmetic as build.gradle.kts, which is what the
          # application compares against. The two have to agree.
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG}/simple-code-${TAG}.apk"

          # The subjects of the commits since the tag before this one, which is
          # what the dialogue shows. Capped, so a long release still fits.
          PREVIOUS=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          RANGE="${TAG}"
          [ -n "$PREVIOUS" ] && RANGE="${PREVIOUS}..${TAG}"
          CHANGELOG=$(git log --no-merges -n 10 --pretty=format:'- %s' "$RANGE")

          jq -n --arg v "$VERSION" --argjson c "$VERSION_CODE" \
                --arg d "$(date -u +%Y-%m-%d)" --arg u "$URL" --arg l "$CHANGELOG" \
                '{version:$v, versionCode:$c, releaseDate:$d, apkUrl:$u, changelog:$l}' \
            > "$RUNNER_TEMP/latest-release.json"
          cat "$RUNNER_TEMP/latest-release.json"

      # The release is published under the identity of the token given here
      # rather than the GITHUB_TOKEN of the run: that one belongs to
      # github-actions[bot], which would then stand as the author of every
      # release. The author cannot be changed afterwards, the API does not
      # expose it for writing, so it has to be settled at creation.
      #
      # Secret RELEASE_PAT: fine grained personal token of lc-4918, scope
      # "Contents: read and write" on this repository alone. Missing, the step
      # fails rather than falling back to the bot without a word.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.RELEASE_PAT }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            ${{ runner.temp }}/latest-release.json
